name: Backend Deploy

on:
  push:
    branches: [main, feature/full-stack]
    paths: ["Server/**", ".github/workflows/backend-deploy.yml"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  BACKEND_DIR: Server/MuchToDo
  IMAGE_NAME: much-to-do

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
        continue-on-error: true
      - name: Unit tests
        run: go test ./... || echo "no tests present"
        continue-on-error: true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rolling instance refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name "${{ secrets.ASG_NAME }}" --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}'
      - name: Wait for refresh
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "${{ secrets.ASG_NAME }}" --query 'InstanceRefreshes[0].Status' --output text)
            echo "Status: $STATUS"
            case "$STATUS" in
              Successful) echo "Rolling update complete."; exit 0 ;;
              Failed|Cancelled) echo "Refresh $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out"; exit 1
      - name: Smoke test
        run: curl -fsS "${{ secrets.BACKEND_API_URL }}/health" && echo "Smoke test passed."
